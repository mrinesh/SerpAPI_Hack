# Lint, typecheck, tests, build and the fixture check on every push and pull request (I-14).
# Runs in replay mode with no secrets: tests never read .env and every provider call is recorded.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: make setup

      - name: Lint and typecheck
        run: make lint

      - name: Tests
        run: make test

      - name: Frontend build
        run: cd frontend && npm run build

      - name: No unused recordings
        run: make fixtures
