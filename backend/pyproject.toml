[project]
name = "realty-intel-backend"
version = "0.1.0"
description = "Backend for the Real Estate Investor Intelligence Platform: SerpApi discovery, Gemini verification, area and competitor enrichment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "serpapi>=1.1.2",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
